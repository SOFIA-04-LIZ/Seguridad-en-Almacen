<!doctype html><html><head><meta charset="utf-8"><title>Responsive layout checks</title></head><body><pre id="results">RUNNING</pre><iframe id="app" style="border:0" src="../index.html"></iframe><script>
const sizes=[[320,568],[360,640],[390,844],[430,932],[540,960],[600,960],[820,1180],[980,1200],[1080,1400],[568,320],[667,375],[844,390],[932,430],[768,1024]];
const frame=document.querySelector('#app'),results=[];
const wait=()=>new Promise(r=>setTimeout(r,120));
frame.onload=async()=>{
 try{
 for(const [width,height] of sizes){
 frame.style.width=width+'px';frame.style.height=height+'px';await wait();
 const doc=frame.contentDocument,win=frame.contentWindow;
 const box=s=>doc.querySelector(s).getBoundingClientRect();
 const check=(condition,message)=>{if(!condition)throw Error(width+'x'+height+': '+message)};
 const hero=doc.querySelector('.hero');
 if(win.getComputedStyle(hero).display!=='none'){
  const title=box('.hero h1');
  check(title.left>=0&&title.right<=width,'heading clipped');
  check(!doc.querySelector('.hero aside'),'old mission panel remains');
  check(doc.querySelector('.intro').textContent.includes('Flying Fish. Cada'),'intro sentences run together');
 }
 check(parseFloat(win.getComputedStyle(doc.querySelector('.setup p:not(.eyebrow)')).fontSize)>=(width<=700?14:16),'instructions too small');
 check(doc.querySelector('#overlay').classList.contains('ready'),'welcome must appear in game');
 check(win.getComputedStyle(doc.querySelector('#overlay')).position==='absolute','welcome must stay in scenario');
 check(box('.setup').bottom<=box('.objectives').top+1,'objectives must follow instructions');
 check(box('.objectives').bottom<=box('.game-shell').top+1,'objectives must precede the game');
 check(win.getComputedStyle(doc.querySelector('.cards')).gridTemplateColumns.split(' ').length===3,'objectives must show three columns');
 check(doc.querySelectorAll('.cards article').length===6,'six objectives must be visible');
 check(box('.header-note').right<=width+1,'header note clipped');
 check(!doc.querySelector('#act-list')&&!doc.querySelector('#hazard-list'),'extra status chips visible');
 check(doc.documentElement.scrollWidth<=width+1,'horizontal page overflow');
 doc.querySelector('#overlay').classList.add('hidden');await wait();
 check(doc.documentElement.scrollWidth<=width+1,'horizontal game overflow');
 const stats=box('.hud-stats'),actions=box('.hud-actions');
 check(Math.abs((stats.top+stats.height/2)-(actions.top+actions.height/2))<=2,'stats and buttons must share one row');
 check(actions.right<=width+1,'pause and restart clipped');
 const stage=box('.stage'),touch=box('.touch');check(stage.width>0&&stage.height>0,'empty stage');
 if(width<=800||height<=550)check(win.getComputedStyle(doc.querySelector('.touch')).display!=='none','touch controls hidden');
 for(const button of win.getComputedStyle(doc.querySelector('.touch')).display==='none'?[]:doc.querySelectorAll('.touch button')){const r=button.getBoundingClientRect();check(r.width>=44&&r.height>=44,'touch target too small');}
 check(box('.game-shell').height<=height+1,'game plus controls taller than screen: '+box('.game-shell').height);
 if(touch.height)check(touch.top>=stage.bottom-1,'controls overlap scene');
 results.push(width+'x'+height+' PASS');doc.querySelector('#overlay').classList.remove('hidden');
 }
 document.querySelector('#results').textContent=results.join('\n')+'\nALL PASS';
 }catch(error){document.querySelector('#results').textContent=results.join('\n')+'\nFAIL '+error.message;}
};
</script></body></html>
